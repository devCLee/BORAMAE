[project]
name = "boramae-api"
version = "0.1.0"
description = "BORAMAE analysis API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "websockets",
    "pydantic==2.14.3",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "xarray==2026.9.0",
    "zarr==3.4.2",
    "fsspec==2026.9.0",
    "aiohttp",
    "boto3==1.44.3",
    "strands-agents==1.65.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "statsmodels==0.15.0",
    "pymannkendall==1.4.3",
    "ruff==0.17.5",
]
agent = [
    "geoagent==1.9.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs the network (POWER or Bedrock); deselected by default"]
addopts = ["-m", "not live", "--import-mode=importlib"]
